<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <title>Whimzyy Detox</title>
  <style>
    body{ margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
          background:#1F0508; color:#F3E7D3; font-family:"DM Sans", Arial, sans-serif; }
    .box{ width:min(480px, 90vw); padding:34px; border-radius:28px; background:#4A0E17; text-align:center;
          box-shadow:0 0 40px rgba(242,184,61,.25); }
    .leaf{ font-size:54px; }
    h1{ margin:8px 0; font-size:30px; color:#F2B83D; }
    p{ line-height:1.5; }
    button{ margin:6px; padding:12px 22px; border:none; border-radius:999px; background:#C9941A; color:#1F0508;
            font-family:inherit; font-size:16px; font-weight:700; cursor:pointer; }
    button.ghost{ background:transparent; border:1px solid rgba(243,231,211,.5); color:#F3E7D3; }
    textarea{ width:100%; box-sizing:border-box; margin-top:10px; padding:10px 14px; border-radius:16px; border:none;
              font-family:inherit; font-size:15px; }
    #why{ display:none; }
    .small{ font-size:13px; opacity:.75; }
  </style>
</head>
<body>
  <div class="box">
    <div class="leaf">🌿</div>
    <h1 id="title">Time's up</h1>
    <p id="text"></p>
    <button id="home">Back to Whimzyy ✨</button>
    <button class="ghost" id="panel">My Detox panel</button>
    <button class="ghost" id="more">Just 5 more minutes 🥺</button>
    <div id="why">
      <textarea id="reason" rows="2" placeholder="Why tho? Be honest (10+ letters)"></textarea>
      <button id="go">Okay, 5 minutes</button>
      <p class="small" id="count"></p>
    </div>
  </div>
  <script src="blocked.js"></script>
</body>
</html>
