<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">

        <meta name="viewport" content="width=device-width,initial-scale=1.0">

        <title>Whimzyy - Vibe</title>

        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=DM+Sans:wght@400;500;700&display=swap">

        <link rel="stylesheet" href="../css/home.css">
        <link rel="stylesheet" href="../css/vibe.css">
        <link rel="stylesheet" href="../css/aboutus.css">
        <link rel="stylesheet" href="../css/rewards.css"> 
        <link rel="stylesheet" href="../css/responsive.css">
        
        <script src="../js/auth.js"></script>
        <script src="../js/theme.js"></script>
        <script src="../js/rewards.js"></script>
        
        <link rel="icon" href="icons/icon-192.png">
    </head>
      
    <script src="../js/pwa.js"></script>

    <body>

        <!--Top Navigation bar-->
        <header class="topbar">

            <!--Whimzyy Side bar-->
            <a href="../index.html" class="brand" title="Back to the start">
                <img src="../stickers/whimzyy.png" alt="Whimzyy" class="whimzyy-logo">
            </a>

            <!--Navigation bar-->
            <nav class="top-nav">

                <!--Work Space-->
                <a href="work-space.html" class="work" title="LOCK IN!!">
                    <img src="../stickers/nav-work.png" alt="Work Space" class="icon" id="work-space-icon">
                    Work Space
                </a>

                <!--Home-->
                <a href="../home.html" class="tab" title="Your daily welcome">
                    <img src="../stickers/nav-home.png" alt="Home" class="icon">
                    Home
                </a>

                <!--About Us-->
                <a href="about-us.html" class="tab" title="The story behind Whimzyy">
                    <img src="../stickers/nav-about.png" alt="About Us" class="icon">
                    About Us
                </a>

            </nav>
        </header>

        <!--Side Navigation bar-->
        <aside class="sidebar" id="sidebar">
            <ul>

                <!--My Day-->
                <li>
                    <a href="my-day.html" title="Plan your day and write your journal">
                        <img src="../stickers/side-myday.png" alt="My Day" class="icon" id="my-day-icon">
                        My Day
                    </a>
                </li>

                <!--Focus-->
                <li>
                    <a href="focus.html" title="Timer, Stopwatch and Pomodoro">
                        <img src="../stickers/side-focus.png" alt="Focus" class="icon">
                        Focus
                    </a>
                </li>

                <!--Detox-->
                <li>
                    <a href="detox.html" title="Screen Time Limit">
                        <img src="../stickers/side-detox.png" alt="Detox" class="icon">
                        Detox
                    </a>
                </li>

                <!--Wellness-->
                <li>
                    <a href="wellness.html" title="Check in, stretch and drink water">
                        <img src="../stickers/side-wellness.png" alt="Wellness" class="icon">
                        Wellness
                    </a>
                </li>

                <!--Productivity-->
                <li>
                    <a href="productivity.html" title="See your progress and patterns">
                        <img src="../stickers/side-productivity.png" alt="Productivity" class="icon">
                        Productivity
                    </a>
                </li>

                <!--Dayverse-->
                <li>
                    <a href="dayverse.html" title="Your slice of life">
                        <img src="../stickers/side-dayverse.png" alt="Dayverse" class="icon">
                        Dayverse
                    </a>
                </li>

                <!--Vibe-->
                <li>
                    <a href="vibe.html" title="Change themes, sounds and backgrounds">
                        <img src="../stickers/side-vibe.png" alt="Vibe" class="icon">
                        Vibe
                    </a>
                </li>

            </ul>
        </aside>

        <!--Main content-->
        <main class="content">
            <div class="vibe-wrap">

                <!--Heading, summary and reset button-->
                <header class="vibe-head">
                    <div>
                        <h1>Vibe</h1>
                        <p class="vibe-summary" id="vibeSummary"></p>
                    </div>

                    <button type="button" class="reset-btn" id="resetVibe">Reset to default vibe</button>
                </header>

                <!--Quick vibes (JavaScript fills them in)-->
                <section class="card quick-card">
                    <h2>Quick vibes</h2>
                    <div class="quick-list" id="quickList"></div>
                </section>

                <!--Two columns-->
                <section class="vibe-cols">

                    <!--Left: themes-->
                    <article class="card themes-card">
                        <h2>Themes</h2>
                        <div class="theme-list" id="themeList"></div>
                    </article>

                    <!--Right: background, then sounds and volume-->
                    <div class="vibe-right">

                        <article class="card bg-card">
                            <h2>Work Space background</h2>
                            <div class="bg-grid" id="bgGrid"></div>
                        </article>

                        <article class="card sound-card">
                            <h2>Sounds and volume</h2>

                            <p class="group-label">Ambience</p>
                            <div class="chips" id="ambienceChips"></div>

                            <p class="group-label">Music</p>
                            <div class="chips" id="musicChips"></div>

                            <div class="volume-list">

                                <div class="vol">
                                    <label class="vol-name" for="volMaster">Master</label>
                                    <input type="range" id="volMaster" min="0" max="100">
                                    <span class="vol-val" id="valMaster"></span>
                                </div>

                                <div class="vol">
                                    <label class="vol-name" for="volAmbience">Ambience</label>
                                    <input type="range" id="volAmbience" min="0" max="100">
                                    <span class="vol-val" id="valAmbience"></span>
                                </div>

                                <div class="vol">
                                    <label class="vol-name" for="volMusic">Music</label>
                                    <input type="range" id="volMusic" min="0" max="100">
                                    <span class="vol-val" id="valMusic"></span>
                                </div>

                                <div class="vol">
                                    <label class="vol-name" for="volChime">Timer chime</label>
                                    <input type="range" id="volChime" min="0" max="100">
                                    <span class="vol-val" id="valChime"></span>
                                    <button type="button" class="test-btn" id="testChime">Test</button>
                                </div>

                            </div>
                        </article>

                    </div>
                </section>

            </div>
        </main>

        <!--JavaScript Links-->
        <script src="../js/sidebar.js"></script>
        <script src="../js/media.js"></script>
        <script src="../js/vibe.js"></script>
    </body>
</html>
